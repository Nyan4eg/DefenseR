[package]
name = "defenser"
version = "0.11.0"
description = "AI-powered PC protection dashboard"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "defenser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40.3"
netstat2 = "0.11.2"
winreg = "0.56.0"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
keyring = "4.2.0"
ort = "=2.0.0-rc.15"
sha2 = "0.11.1"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
sys-locale = "0.3.2"
zip = { version = "9", default-features = false, features = ["deflate"] }


# Feature extraction loops over every byte of a file; unoptimized it is too slow to use.
[profile.dev]
opt-level = 1

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
